name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  test-artifacts:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        artifact: ["wheel", "sdist"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install and test ${{ matrix.artifact }}
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/artifact-test"
          if [[ "${{ matrix.artifact }}" == "wheel" ]]; then
            package=(dist/*.whl)
          else
            package=(dist/*.tar.gz)
          fi
          "${RUNNER_TEMP}/artifact-test/bin/python" -m pip install "${package[@]}"
          "${RUNNER_TEMP}/artifact-test/bin/python" examples/spinner.py

  publish:
    needs: test-artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-kernel
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
