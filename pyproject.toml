[project]
name = "agent-kernel"
version = "0.1.0"
description = "Framework-neutral authority kernel for capability-gated agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
agno = ["agno>=2.6.13,<3"]
dspy = ["dspy>=3.2.1,<4"]
dev = ["pytest>=9,<10", "pytest-cov>=6,<7", "pytest-asyncio>=0.25,<2", "mypy>=1.15,<2", "ruff>=0.11,<1", "build>=1.2,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_kernel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    '''ignore:^The 'prefix' argument in InputField/OutputField is deprecated and has no effect in DSPy\. It will be removed in a future version\.$:DeprecationWarning:^dspy\.''',
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_kernel"]
